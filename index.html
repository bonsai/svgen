<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>svgen API</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#e5e7eb;background:#111827}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{text-align:center;max-width:900px;width:100%}#preview{display:inline-block;padding:16px;background:#fff;border-radius:12px}
    img{display:block;image-rendering:auto}code{word-break:break-all}
    .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(760px,100%);margin:20px auto}
    .tile{aspect-ratio:1;background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;box-shadow:0 4px 18px #0004}
    .tile img{width:100%;height:100%;object-fit:contain;border-radius:6px}
    h1{font-size:22px;margin:0 0 8px}.note{opacity:.7;font-size:13px}
  </style>
</head>
<body>
<main id="app"></main>
<script>
const p=new URLSearchParams(location.search);
const num=(k,d,min=0)=>Math.max(min,Number(p.get(k)??d));
const size=num('size',64,8), seed=num('seed',42), opacity=Math.min(1,Math.max(0,Number(p.get('opacity')??1)));
const rotate=Number(p.get('rotate')??0), count=num('count',6,1), stroke=num('stroke',size*.075,.5);
const backgrounds={white:'#fff',black:'#0b1020',light:'#f8fafc',transparent:'none'};
const background=p.get('background')||'white';
const paletteNames={neon:['#111827','#22d3ee','#f472b6','#facc15'],cool:['#0f172a','#38bdf8','#a78bfa','#fb7185'],rainbow:['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6']};
function palette(name){const raw=name??p.get('palette');if(!raw)return paletteNames.neon;if(paletteNames[raw])return paletteNames[raw];return raw.split(',').map(x=>x.trim()).filter(Boolean)}
function makeSvg(options={}){
  const s=options.size??size, sd=options.seed??seed, type=options.type??(p.get('type')||'random'), colors=palette(options.palette), bgName=options.background??background;
  const op=options.opacity??opacity, rot=options.rotate??rotate, cnt=options.count??count, sw=options.stroke??stroke;
  let x=(sd>>>0)||1; const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}; const pick=a=>a[Math.floor(rnd()*a.length)];
  function square(){const n=Math.max(2,Math.min(8,Number(options.grid??p.get('grid')??(2+Math.floor(rnd()*4))))),cell=s/n;let b='';for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++)if(rnd()>.25)b+=`<rect x="${xx*cell}" y="${y*cell}" width="${cell+.2}" height="${cell+.2}" fill="${pick(colors)}"/>`;return b}
  function egg(){const rx=s*(Number(options.rx??p.get('rx')??(.31+rnd()*.08))),ry=s*(Number(options.ry??p.get('ry')??(.40+rnd()*.06)));return `<ellipse cx="${s/2}" cy="${s/2}" rx="${rx}" ry="${ry}" fill="${pick(colors)}" transform="rotate(${rot} ${s/2} ${s/2})"/>`}
  function rainbow(){const cx=s/2,cy=s*.62,step=sw;let b='';[...colors,...colors].slice(0,5).forEach((c,i)=>{const r=s*.46-i*step;b+=`<path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${c}" stroke-width="${step}"/>`});return b}
  function pattern(){let b='';for(let i=0;i<cnt;i++){const r=s*(.04+rnd()*.14);b+=`<circle cx="${rnd()*s}" cy="${rnd()*s}" r="${r}" fill="${pick(colors)}"/>`}return b}
  let kind=type;if(kind==='random')kind=pick(['square','egg','rainbow','pattern']);
  const body=({square,egg,rainbow,pattern}[kind]||pattern)(); const bg=backgrounds[bgName]??bgName;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><rect width="100%" height="100%" fill="${bg}"/><g opacity="${op}">${body}</g></svg>`;
}
function showSvg(container,svg){const blob=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const img=document.createElement('img');img.src=blob;img.alt='svgen';container.appendChild(img)}
const app=document.querySelector('#app');
if(location.pathname.replace(/\/$/,'')==='/random-grid'){
  app.innerHTML='<h1>svgen /random-grid</h1><p class="note">16 random designs · 4 × 4 gallery</p><section class="gallery"></section><p class="note">Refresh to generate another gallery.</p>';
  const gallery=app.querySelector('.gallery');
  const types=['square','egg','rainbow','pattern']; const palettes=['neon','cool','rainbow'];
  for(let i=0;i<16;i++){
    const tile=document.createElement('div');tile.className='tile';gallery.appendChild(tile);
    showSvg(tile,makeSvg({size:128,seed:Math.floor(Math.random()*0xffffffff),type:types[Math.floor(Math.random()*types.length)],palette:palettes[Math.floor(Math.random()*palettes.length)],count:3+Math.floor(Math.random()*9)}));
  }
}else{
  app.innerHTML='<div id="preview"></div><p>svgen — URL API</p><code id="url"></code>';
  showSvg(document.querySelector('#preview'),makeSvg()); document.querySelector('#url').textContent=location.href;
}
</script>
</body>
</html>
