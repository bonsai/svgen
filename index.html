<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>svgen API</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:14px system-ui,sans-serif;background:#111827;color:#e5e7eb}main{text-align:center}#preview{display:inline-block;padding:16px;background:#fff;border-radius:12px}img{display:block;image-rendering:auto}code{word-break:break-all}</style>
</head>
<body>
<main>
  <div id="preview"></div>
  <p>svgen — URL API</p>
  <code id="url"></code>
</main>
<script>
const p=new URLSearchParams(location.search);
const num=(k,d,min=0)=>Math.max(min,Number(p.get(k)??d));
const type=p.get('type')||'random';
const size=num('size',64,8), seed=num('seed',42), opacity=Math.min(1,Math.max(0,Number(p.get('opacity')??1)));
const rotate=Number(p.get('rotate')??0), count=num('count',6,1), stroke=num('stroke',size*.075,.5);
const backgrounds={white:'#fff',black:'#0b1020',light:'#f8fafc',transparent:'none'};
const background=p.get('background')||'white';
const paletteNames={neon:['#111827','#22d3ee','#f472b6','#facc15'],cool:['#0f172a','#38bdf8','#a78bfa','#fb7185'],rainbow:['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6']};
function palette(){const raw=p.get('palette');if(!raw)return paletteNames.neon;if(paletteNames[raw])return paletteNames[raw];return raw.split(',').map(x=>x.trim()).filter(Boolean)}
const colors=palette(); let x=(seed>>>0)||1; const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}; const pick=a=>a[Math.floor(rnd()*a.length)];
function square(){const n=Math.max(2,Math.min(8,Number(p.get('grid')??(2+Math.floor(rnd()*4))))),cell=size/n;let b='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(rnd()>.25)b+=`<rect x="${x*cell}" y="${y*cell}" width="${cell+.2}" height="${cell+.2}" fill="${pick(colors)}"/>`;return b}
function egg(){const rx=size*(Number(p.get('rx')??(.31+rnd()*.08))),ry=size*(Number(p.get('ry')??(.40+rnd()*.06)));return `<ellipse cx="${size/2}" cy="${size/2}" rx="${rx}" ry="${ry}" fill="${pick(colors)}" transform="rotate(${rotate} ${size/2} ${size/2})"/>`}
function rainbow(){const cx=size/2,cy=size*.62,step=stroke;let b='';[...colors,...colors].slice(0,5).forEach((c,i)=>{const r=size*.46-i*step;b+=`<path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${c}" stroke-width="${step}"/>`});return b}
function pattern(){let b='';for(let i=0;i<count;i++){const r=size*(.04+rnd()*.14);b+=`<circle cx="${rnd()*size}" cy="${rnd()*size}" r="${r}" fill="${pick(colors)}"/>`}return b}
let kind=type;if(kind==='random')kind=pick(['square','egg','rainbow','pattern']);const body=({square,egg,rainbow,pattern}[kind]||pattern)();
const bg=backgrounds[background]??background;const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="${bg}"/><g opacity="${opacity}">${body}</g></svg>`;
const blob=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));document.querySelector('#preview').innerHTML=`<img width="${size}" height="${size}" src="${blob}" alt="svgen">`;document.querySelector('#url').textContent=location.href;
</script>
</body>
</html>
