<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>svgen /random-grid</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#e5e7eb;font:14px system-ui,sans-serif}main{text-align:center}#preview{display:inline-block;padding:24px;background:#fff;border-radius:16px}img{display:block}a{color:inherit}</style></head><body><main><div id="preview"></div><p>svgen /random-grid · square only</p><a href="./">regenerate</a></main><script>
const p=new URLSearchParams(location.search);const seed=Number(p.get('seed'))||(crypto.getRandomValues(new Uint32Array(1))[0]||1);let x=seed>>>0;const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296};const size=128;const grid=Math.max(2,Math.min(8,Number(p.get('grid'))||2+Math.floor(rnd()*7)));const palettes=[['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6'],['#111827','#22d3ee','#f472b6','#facc15'],['#0f172a','#38bdf8','#a78bfa','#fb7185']];const colors=palettes[Math.floor(rnd()*palettes.length)];const pick=a=>a[Math.floor(rnd()*a.length)];const cell=size/grid;let body='';for(let y=0;y<grid;y++)for(let xx=0;xx<grid;xx++)if(rnd()>.25)body+=`<rect x="${xx*cell}" y="${y*cell}" width="${cell+.3}" height="${cell+.3}" fill="${pick(colors)}"/>`;const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="#fff"/>${body}</svg>`;const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));document.querySelector('#preview').innerHTML=`<img src="${url}" width="${size}" height="${size}" alt="random square grid">`;history.replaceState(null,'',`?seed=${seed}&grid=${grid}`);
</script></body></html>
