<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>svgen /random-grid</title><style>body{margin:0;background:#111827;color:#e5e7eb;font:14px system-ui,sans-serif;padding:24px}main{max-width:900px;margin:auto}h1{font-size:18px}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.item{background:#1f2937;padding:12px;border-radius:12px}.item svg{display:block;width:100%;height:auto;background:#fff;border-radius:8px}.label{margin-top:8px;font-size:12px;color:#cbd5e1}pre{white-space:pre-wrap;word-break:break-word;background:#030712;padding:16px;border-radius:12px;overflow:auto}a{color:inherit}</style></head><body><main><h1>svgen /random-grid · animation array</h1><div id="gallery"></div><h2>JSON</h2><pre id="json"></pre><p><a id="regenerate" href="./">regenerate</a></p></main><script>
const p=new URLSearchParams(location.search);const seed=Number(p.get('seed'))||(crypto.getRandomValues(new Uint32Array(1))[0]||1);const grid=4,size=128;let x=seed>>>0;const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296};const palettes=[['#111827','#22d3ee'],['#0f172a','#f472b6'],['#111827','#facc15'],['#172554','#60a5fa'],['#18181b','#a78bfa'],['#052e16','#4ade80'],['#3b0764','#f0abfc'],['#431407','#fb923c'],['#082f49','#67e8f9'],['#450a0a','#fda4af']];const variants=['blink','pulse','wave','scan','shift','checker','rotate','breathe','cascade','random'];const animations={blink:'opacity .9s steps(1,end) infinite alternate',pulse:'opacity 1.2s ease-in-out infinite alternate',wave:'opacity 1.4s ease-in-out infinite alternate',scan:'transform 1.8s linear infinite alternate',shift:'transform 2.2s ease-in-out infinite alternate',rotate:'transform 2.5s linear infinite',breathe:'transform 1.7s ease-in-out infinite alternate',cascade:'opacity 1.6s ease-in-out infinite alternate',checker:'opacity 1s steps(2,end) infinite alternate',random:'opacity 1.1s ease-in-out infinite alternate'};function svgFor(variant,i,colors){let body='';for(let y=0;y<grid;y++)for(let xx=0;xx<grid;xx++){const on=rnd()>.28;const color=colors[(xx+y+i)%2];if(!on)continue;let delay=((xx+y+i)%grid)*-.12;if(variant==='cascade')delay=-(y*.18+xx*.08);const extra=`style="fill:${color};animation:${animations[variant]};animation-delay:${delay}s;transform-origin:${xx*cell+cell/2}px ${y*cell+cell/2}px"`;body+=`<rect x="${xx*cell}" y="${y*cell}" width="${cell+.4}" height="${cell+.4}" ${extra}/>`}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}"><style>@keyframes blink{from{opacity:.15}to{opacity:1}}@keyframes pulse{from{opacity:.2}to{opacity:1}}@keyframes wave{from{opacity:.2}to{opacity:1}}@keyframes scan{from{transform:translateX(-3px)}to{transform:translateX(3px)}}@keyframes shift{from{transform:translateY(-3px)}to{transform:translateY(3px)}}@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes breathe{from{transform:scale(.8)}to{transform:scale(1)}}@keyframes cascade{from{opacity:.15}to{opacity:1}}@keyframes checker{from{opacity:.2}to{opacity:1}}@keyframes random{from{opacity:.2}to{opacity:1}}</style><rect width="100%" height="100%" fill="#fff"/>${body}</svg>`}const cell=size/grid;const data=variants.map((animation,index)=>{const colors=palettes[(Math.floor(rnd()*palettes.length)+index)%palettes.length];return{id:index+1,type:'square-grid',animation,grid,size,seed:seed+index,colors,svg:svgFor(animation,index,colors)}});document.querySelector('#gallery').innerHTML=data.map(d=>`<article class="item"><div>${d.svg}</div><div class="label">${d.id}. ${d.animation} · 4×4 · ${d.colors.join(' / ')}</div></article>`).join('');const jsonData=data.map(({svg,...rest})=>rest);document.querySelector('#json').textContent=JSON.stringify(jsonData,null,2);const out=new URL(location.href);out.search='';out.searchParams.set('seed',seed);out.searchParams.set('grid','4');history.replaceState(null,'',out);document.querySelector('#regenerate').href=`./?seed=${seed+1}&grid=4`;
</script></body></html>
