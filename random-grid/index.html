<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>svgen /random-grid · 2-color animation</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#e5e7eb;font:14px system-ui,sans-serif}main{text-align:center}#preview{display:inline-block;padding:24px;background:#fff;border-radius:16px}svg{display:block;image-rendering:pixelated}.cell{animation:flip 1.6s steps(1,end) infinite}@keyframes flip{0%,49%{opacity:1}50%,100%{opacity:.08}}a{color:inherit}</style></head><body><main><div id="preview"></div><p>svgen /random-grid · 2-color animation · 4×4</p><a id="regenerate" href="./">regenerate</a></main><script>
const p=new URLSearchParams(location.search);const seed=Number(p.get('seed'))||(crypto.getRandomValues(new Uint32Array(1))[0]||1);let x=seed>>>0;const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296};const size=128;const grid=4;const palettes=[['#111827','#22d3ee'],['#0f172a','#f472b6'],['#111827','#facc15'],['#ffffff','#111827']];const paletteIndex=Math.max(0,Math.min(palettes.length-1,Number(p.get('palette'))||Math.floor(rnd()*palettes.length)));const colors=palettes[paletteIndex];const cell=size/grid;let body='';for(let y=0;y<grid;y++)for(let xx=0;xx<grid;xx++)if(rnd()>.25){const d=(y*grid+xx)*0.06;body+=`<rect class="cell" style="animation-delay:${d}s" x="${xx*cell}" y="${y*cell}" width="${cell+.4}" height="${cell+.4}" fill="${colors[(xx+y)%2]}"/>`}const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="${colors[0]}"/>${body}</svg>`;document.querySelector('#preview').innerHTML=svg;const out=new URL(location.href);out.search='';out.searchParams.set('seed',seed);out.searchParams.set('grid',grid);out.searchParams.set('palette',paletteIndex);history.replaceState(null,'',out);document.querySelector('#regenerate').href=`./?grid=4&palette=${paletteIndex}&seed=${seed+1}`;
</script></body></html>
