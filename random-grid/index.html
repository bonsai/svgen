<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>svgen /random-grid</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#e5e7eb;font:14px system-ui,sans-serif}main{text-align:center}#preview{display:inline-block;padding:24px;background:#fff;border-radius:16px}img{display:block}a{color:inherit}</style></head><body><main><div id="preview"></div><p>svgen /random-grid · square / QR-like</p><a id="regenerate" href="./">regenerate</a></main><script>
const p=new URLSearchParams(location.search);const seed=Number(p.get('seed'))||(crypto.getRandomValues(new Uint32Array(1))[0]||1);let x=seed>>>0;const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296};const size=128;const mode=p.get('mode')==='qr'?'qr':'square';const grid=Math.max(2,Math.min(8,Number(p.get('grid'))||2+Math.floor(rnd()*7)));const qr=Math.max(5,Math.min(29,Number(p.get('qr'))||11));const palettes=[['#111827','#22d3ee','#f472b6','#facc15'],['#0f172a','#38bdf8','#a78bfa','#fb7185'],['#111827','#ef4444','#f59e0b','#22c55e']];const paletteIndex=Math.max(0,Math.min(palettes.length-1,Number(p.get('palette'))||Math.floor(rnd()*palettes.length)));const colors=palettes[paletteIndex];const pick=a=>a[Math.floor(rnd()*a.length)];const cell=size/grid;let body='';const dark=()=>pick(colors);const addFinder=(ox,oy,n)=>{const c=size/n;body+=`<rect x="${ox*c}" y="${oy*c}" width="${7*c}" height="${7*c}" fill="#fff"/><rect x="${(ox+1)*c}" y="${(oy+1)*c}" width="${5*c}" height="${5*c}" fill="${dark()}"/><rect x="${(ox+2)*c}" y="${(oy+2)*c}" width="${3*c}" height="${3*c}" fill="#fff"/><rect x="${(ox+3)*c}" y="${(oy+3)*c}" width="${c}" height="${c}" fill="${dark()}"/>`};if(mode==='qr'){const n=qr,c=size/n;addFinder(1,1,n);addFinder(n-8,1,n);addFinder(1,n-8,n);for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++){if((xx<9&&y<9)||(xx>=n-9&&y<9)||(xx<9&&y>=n-9))continue;if(rnd()>.52)body+=`<rect x="${xx*c}" y="${y*c}" width="${c+.2}" height="${c+.2}" fill="${dark()}"/>`}}else{for(let y=0;y<grid;y++)for(let xx=0;xx<grid;xx++)if(rnd()>.25)body+=`<rect x="${xx*cell}" y="${y*cell}" width="${cell+.3}" height="${cell+.3}" fill="${dark()}"/>`}}const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="#fff"/>${body}</svg>`;const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));document.querySelector('#preview').innerHTML=`<img src="${url}" width="${size}" height="${size}" alt="random square grid">`;const out=new URL(location.href);out.search='';out.searchParams.set('seed',seed);out.searchParams.set('mode',mode);out.searchParams.set('grid',grid);out.searchParams.set('qr',qr);out.searchParams.set('palette',paletteIndex);history.replaceState(null,'',out);document.querySelector('#regenerate').href=`./?mode=${encodeURIComponent(mode)}&grid=${grid}&qr=${qr}&palette=${paletteIndex}&seed=${seed+1}`;
</script></body></html>
